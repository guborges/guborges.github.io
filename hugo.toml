baseURL = "https://guborges.github.io/"
languageCode = "pt-br"
defaultContentLanguage = "pt"
title = "DBA Gustavo Borges"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
enableInlineShortcodes = true
removePathAccents = true

[pagination]
  pagerSize = 13

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "Artigos técnicos sobre Oracle, PostgreSQL, MySQL, performance tuning, alta disponibilidade e infraestrutura de banco de dados."
  author = "Gustavo Borges"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  [params.homeInfoParams]
    Title = "DBA Gustavo Borges 👋"
    Content = """
Senior Oracle DBA (Oracle ACE Associate, OCP) — Exadata, RAC, Data Guard, RMAN e performance tuning; também PostgreSQL e MySQL. Estudos, labs e soluções reais do dia a dia de banco de dados.

<style>
.topic-lead{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;opacity:.55;margin:1.4rem 0 .5rem;font-weight:700}
.topic-nav{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.4rem}
.topic-nav a{padding:.34rem .8rem;border-radius:7px;background:var(--code-bg);color:var(--primary)!important;font-size:.85rem;font-weight:500;text-decoration:none;border:1px solid var(--border);transition:background .2s,border-color .2s}
.topic-nav a:hover{background:var(--tertiary);border-color:var(--secondary)}
.topic-nav a.all{background:var(--primary);color:var(--theme)!important;border-color:var(--primary)}
</style>
<div class="topic-lead">Navegue por tópico</div>
<div class="topic-nav">
<a href="/categories/oracle-dba/">Oracle DBA</a>
<a href="/categories/data-guard/">Data Guard</a>
<a href="/categories/performance--tuning/">Performance Tuning</a>
<a href="/categories/backup--recovery/">Backup &amp; Recovery</a>
<a href="/categories/asm--storage/">ASM &amp; Storage</a>
<a href="/categories/oracle-26ai/">Oracle 26ai</a>
<a href="/categories/postgresql/">PostgreSQL</a>
<a href="/categories/mysql/">MySQL</a>
<a href="/categories/replicacao/">Replicação</a>
<a href="/categories/scripts--automacao/">Scripts &amp; Automação</a>
<a href="/categories/cloud/">Cloud</a>
<a href="/categories/seguranca/">Segurança</a>
<a href="/categories/ia/">IA</a>
<a class="all" href="/posts/">Todos os posts →</a>
</div>
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/guborges"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/gustavoborges/"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@DBAGustavoBorges"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[params.assets]
  disableHLJS = true
  favicon = "/favicon.png"
  apple_touch_icon = "/favicon.png"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "archives"
  name = "Arquivo"
  url = "/archives/"
  weight = 20
[[menu.main]]
  identifier = "categories"
  name = "Categorias"
  url = "/categories/"
  weight = 30
[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 40
[[menu.main]]
  identifier = "search"
  name = "Buscar"
  url = "/search/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

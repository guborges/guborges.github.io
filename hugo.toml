baseURL = "https://guborges.github.io/"
languageCode = "pt-br"
defaultContentLanguage = "pt"
title = "DBA Gustavo Borges"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
enableInlineShortcodes = true
removePathAccents = true

[pagination]
  pagerSize = 13

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "Artigos técnicos sobre Oracle, PostgreSQL, MySQL, performance tuning, alta disponibilidade e infraestrutura de banco de dados."
  author = "Gustavo Borges"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  [params.homeInfoParams]
    Title = "DBA Gustavo Borges"
    Content = """
Oracle ACE Associate · OCP · AWS Certified. Especialista em bancos de dados de missão crítica — Exadata, RAC, Data Guard, RMAN, ASM e performance tuning — com atuação também em PostgreSQL e MySQL. Aqui publico artigos técnicos, laboratórios e soluções aplicadas de administração de banco de dados.

<style>
.topics{margin:1.6rem 0 .2rem;font-size:.95rem;color:var(--secondary)}
.topics a{color:var(--secondary);text-decoration:none;border-bottom:1px solid transparent;transition:color .15s ease,border-color .15s ease}
.topics a:hover{color:var(--primary);border-bottom-color:var(--primary)}
.topics .sep{opacity:.3;margin:0 .6rem}
</style>
<nav class="topics"><a href="/categories/oracle-dba/">Oracle DBA</a><span class="sep">·</span><a href="/categories/data-guard/">Data Guard</a><span class="sep">·</span><a href="/categories/performance--tuning/">Performance</a><span class="sep">·</span><a href="/categories/backup--recovery/">Backup &amp; Recovery</a><span class="sep">·</span><a href="/categories/postgresql/">PostgreSQL</a><span class="sep">·</span><a href="/categories/oracle-26ai/">Oracle 26ai</a><span class="sep">·</span><a href="/categories/cloud/">Cloud</a><span class="sep">·</span><a href="/categories/">Todos →</a></nav>
"""

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/guborges"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/gustavoborges/"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@DBAGustavoBorges"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[params.assets]
  disableHLJS = true
  favicon = "/favicon.png"
  apple_touch_icon = "/favicon.png"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "archives"
  name = "Arquivo"
  url = "/archives/"
  weight = 20
[[menu.main]]
  identifier = "categories"
  name = "Categorias"
  url = "/categories/"
  weight = 30
[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 40
[[menu.main]]
  identifier = "search"
  name = "Buscar"
  url = "/search/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true

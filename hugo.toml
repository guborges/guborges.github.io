baseURL = "https://guborges.github.io/"
languageCode = "pt-br"
defaultContentLanguage = "pt"
title = "DBA Gustavo Borges"
theme = "PaperMod"
enableRobotsTXT = true
enableEmoji = true
enableInlineShortcodes = true

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  description = "Artigos técnicos sobre Oracle, PostgreSQL, MySQL, performance tuning, alta disponibilidade e infraestrutura de banco de dados."
  author = "Gustavo Borges"
  defaultTheme = "dark"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowWordCount = true
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true

  [params.homeInfoParams]
    Title = "DBA Gustavo Borges 👋"
    Content = "Senior Oracle DBA (Oracle ACE Associate, OCP) com foco em Exadata, RAC, Data Guard, RMAN e performance tuning — também PostgreSQL e MySQL. Aqui registro estudos, labs e soluções do dia a dia de banco de dados."

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/guborges"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/gustavoborges/"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@DBAGustavoBorges"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    threshold = 0.4
    minMatchCharLength = 2
    keys = ["title", "permalink", "summary", "content"]

[params.assets]
  disableHLJS = true
  favicon = "/favicon.png"
  apple_touch_icon = "/favicon.png"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "archives"
  name = "Arquivo"
  url = "/archives/"
  weight = 20
[[menu.main]]
  identifier = "categories"
  name = "Categorias"
  url = "/categories/"
  weight = 30
[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 40
[[menu.main]]
  identifier = "search"
  name = "Buscar"
  url = "/search/"
  weight = 50

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"
  [markup.goldmark.renderer]
    unsafe = true
